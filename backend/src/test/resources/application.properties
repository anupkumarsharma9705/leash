# Tests must never race the background reconciler. Individual tests invoke reconcileOnce()
# explicitly after advancing a MutableClock.
leash.reconciler.enabled=false

# Admin credentials for tests only. The plaintext password is "admin-test-password".
leash.admin.username=admin
leash.admin.password-hash=$2a$10$fJGOIu3FIJi7HVDAadwm9OCfwYvqb.1RZ.x70mCXeruUvTyVM5JNa

# Test database password
spring.datasource.password=leash-test-password

# Test Hikari pool (smaller for Testcontainers)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
