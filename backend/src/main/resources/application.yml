spring:
  application:
    name: leash
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:leash}
    username: ${DB_USER:leash}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${HIKARI_LEAK_THRESHOLD:60000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  tomcat:
    threads:
      max: 200
    accept-count: 100
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

leash:
  max-payment-minor: ${LEASH_MAX_PAYMENT_MINOR:100000}
  admin:
    username: admin
    password-hash: "$2b$10$oIqF8i3gVmNOFNtvnn2BLuSCtbZp7cAnsIeYfiHd2BwyzQB0rCj8."
  reconciler:
    enabled: ${LEASH_RECONCILER_ENABLED:true}
    interval: ${LEASH_RECONCILER_INTERVAL:30s}
    approved-retry-after: ${LEASH_RECONCILER_APPROVED_RETRY_AFTER:60s}
    submitted-poll-after: ${LEASH_RECONCILER_SUBMITTED_POLL_AFTER:10m}
    batch-size: ${LEASH_RECONCILER_BATCH_SIZE:100}
  demo:
    agent-name: ${LEASH_DEMO_AGENT_NAME:Invoice Agent}
    weekly-limit-minor: ${LEASH_DEMO_WEEKLY_LIMIT_MINOR:200000}
    auto-approve-threshold-minor: ${LEASH_DEMO_AUTO_APPROVE_THRESHOLD_MINOR:5000}
    allowed-payees:
      - ${LEASH_DEMO_ALLOWED_PAYEE:alice@example.com}
    connect-timeout: 5s
    read-timeout: 15s

paypal:
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  allow-live: ${LEASH_ALLOW_LIVE:false}
  connect-timeout: 3s
  read-timeout: 10s

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    com.leash: INFO

---
spring:
  config:
    activate:
      on-profile: demo
logging:
  level:
    com.leash: INFO

---
spring:
  config:
    activate:
      on-profile: test
leash:
  reconciler:
    enabled: false
logging:
  level:
    com.leash: WARN
