name: Publish leash-core

on:
  push:
    tags:
      - 'v*-core'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.4.0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Verify before publishing
        run: ./mvnw -B -pl leash-core -am verify

      - name: Publish to GitHub Packages
        run: ./mvnw -B -pl leash-core -am deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
