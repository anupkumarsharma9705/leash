# Local development only. Production uses Render's managed PostgreSQL.
services:
  postgres:
    image: postgres:16
    container_name: leash-postgres
    environment:
      POSTGRES_DB: leash
      POSTGRES_USER: leash
      POSTGRES_PASSWORD: leash-local-only
    ports:
      - "5432:5432"
    volumes:
      - leash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leash -d leash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  leash-pgdata:
