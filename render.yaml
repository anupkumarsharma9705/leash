# Render blueprint: one Docker web service plus managed PostgreSQL.
# No public URL is claimed by the repository; deploying requires the owner's Render account.
services:
  - type: web
    name: leash
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: false
    # Build with relative API paths (same-origin). Override VITE_API_BASE_URL if deploying
    # frontend and backend on different domains.
    buildArgs:
      - key: VITE_API_BASE_URL
        value: ""
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local,demo
      - key: LEASH_ALLOW_LIVE
        value: "false"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LEASH_RECONCILER_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: leash-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: leash-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: leash-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: leash-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: leash-db
          property: password

databases:
  - name: leash-db
    databaseName: leash
    user: leash
    plan: free
    region: singapore
